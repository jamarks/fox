<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Set up fox</title><link rel="icon" href="/fox.svg" type="image/svg+xml"><link rel="stylesheet" href="/enroll.css"><script src="/enroll.js" defer></script></head>
<body><main><img src="/fox.svg" width="48" height="48" alt=""><h1>Set up your passkey</h1><p>On your server, run <code>node bin/fox-enroll.mjs</code> as the Fox user. Enter the one-time code printed in your SSH terminal. No sessions are visible until setup finishes.</p><form id="enroll"><label for="code">One-time enrollment code</label><input id="code" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required><button type="submit">Create passkey</button></form><p id="status" role="status" aria-live="polite"></p></main></body></html>
