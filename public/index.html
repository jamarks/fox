<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fox</title>
  <link rel="icon" href="/fox.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <aside id="sidebar">
    <header class="side-head">
      <div class="brand" role="img" aria-label="fox"><svg class="brand-letter brand-f" viewBox="0 0 16 24" aria-hidden="true"><path d="M12.2 1C8 1 6.3 3.3 5.6 6.4L5 9H2.5l-.7 3H4.3L1.8 23h3.8l2.5-11h3.4l.7-3H8.8l.6-2.6c.3-1.3 1-1.9 2.5-1.9h2.2l.8-3.5z" fill="currentColor"/></svg><svg class="fox" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 3 L13 9 L19 9 L28 3 L27 15 C27 22 22 28 16 29 C10 28 5 22 5 15 Z" fill="currentColor"/><path d="M9 18 L16 29 L23 18 L16 21 Z" fill="var(--panel)"/><circle cx="16" cy="23.5" r="1.6" fill="currentColor"/><circle cx="11.5" cy="16" r="1.5" fill="var(--panel)"/><circle cx="20.5" cy="16" r="1.5" fill="var(--panel)"/></svg><svg class="brand-letter brand-x" viewBox="0 0 20 24" aria-hidden="true"><path d="M4.6 8h4.1l2.5 3.8L15.7 8h4.4L13 14l4.9 8h-4.5L10 16.6 4.3 22H0l8.1-7.9z" fill="currentColor"/></svg></div>
      <div class="row">
        <select id="theme" title="Theme">
          <option value="dark">dark</option>
          <option value="dusk">dusk</option>
          <option value="mauve">mauve</option>
          <option value="terracotta">terracotta</option>
          <option value="copper">copper</option>
          <option value="plum">plum</option>
          <option value="sky">sky</option>
        </select>
        <button type="button" id="pick-folder" class="icon" title="Open fx in a folder…"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4a1 1 0 0 1 1-1h3.2l1.5 1.5h6.3a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/><path d="M8 7v4M6 9h4"/></svg></button>
        <button id="bell" class="icon" title="Sound + desktop notification when an agent finishes or needs input" aria-label="Notifications"><svg class="bell-on" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.5H3z"/><path d="M6.5 14a1.5 1.5 0 0 0 3 0"/></svg><svg class="bell-off" viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V7a4 4 0 0 1 6.6-3"/><path d="M12 7v4l1 1.5H5.5"/><path d="M6.5 14a1.5 1.5 0 0 0 3 0"/><path d="M2 2l12 12"/></svg></button>
        <button id="global-search-open" class="icon" title="Search all sessions (⌥Space)" aria-label="Search all sessions"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg></button>
        <button id="refresh" class="icon" title="Refresh" aria-label="Refresh"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg></button>
        <button id="keys" class="icon" title="Keyboard shortcuts (⌥?)">?</button>
      </div>
    </header>
    <div id="summary"></div>
    <div id="reply-inbox" class="hidden">
      <button id="reply-inbox-toggle" type="button" aria-expanded="false">● <span id="reply-inbox-count"></span> <span id="reply-inbox-label">new replies</span> <span class="inbox-caret">▾</span></button>
      <div id="reply-inbox-list" class="hidden"></div>
    </div>
    <form id="new-session" autocomplete="off" class="hidden">
      <div class="row">
        <input id="new-cwd" placeholder="~/path/to/repo" />
        <button type="submit" class="icon" title="Open">↵</button>
      </div>
      <div id="new-cwd-hint" class="hint"></div>
    </form>
    <div id="session-groups"></div>
  </aside>

  <div id="global-search" class="hidden" role="dialog" aria-modal="true" aria-label="Search all sessions">
    <div class="global-search-box">
      <div class="global-search-head"><svg aria-hidden="true" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg><input id="global-search-query" placeholder="Search sessions and messages…" autocomplete="off" aria-label="Search sessions and messages" /><kbd>esc</kbd></div>
      <div id="global-search-results" role="listbox" aria-label="Search results"></div>
      <div class="global-search-footer">↑↓ navigate <span>↵ open</span></div>
    </div>
  </div>

  <div id="newsheet" class="hidden">
    <form class="sheet" id="newform">
      <div class="ns-head">New session in <span class="ns-folder" id="ns-folder"></span></div>
      <label class="ns-label" for="ns-model">Model</label>
      <div class="row ns-model-row"><span id="ns-badge"></span><select id="ns-model"><option value="">fx default</option></select><span id="ns-prov"></span></div>
      <div id="ns-tools" class="hidden"></div>
      <div class="row ns-actions"><span class="muted ns-hint">↵ open · esc cancel</span><button type="button" id="ns-cancel">Cancel</button><button type="submit" class="primary">Open</button></div>
    </form>
  </div>
  <div class="resizer" id="rs-left" title="Drag to resize"></div>
  <main id="center">
    <div id="tabbar"><div id="tabs"></div><button id="toggle-transcript" class="icon">⇥</button></div>
    <div id="terminals">
      <div id="empty-state">
        <h2>No terminal open</h2>
        <p>Click a session on the left, or start a new one in a folder.</p>
      </div>
    </div>
  </main>

  <div class="resizer" id="rs-right" title="Drag to resize"></div>
  <section id="transcript">
    <header class="side-head">
      <div id="transcript-title"></div>
      <button id="close-transcript" class="icon" title="Close">×</button>
    </header>
    <div id="transcript-meta"></div>
    <div id="transcript-body"><p class="muted">Select a session to see its files and subagents.</p></div>
  </section>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
