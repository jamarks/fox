<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>fox</title>
  <link rel="icon" href="/fox.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <aside id="sidebar">
    <header class="side-head">
      <div class="brand"><span>f</span><svg class="fox" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 3 L13 9 L19 9 L28 3 L27 15 C27 22 22 28 16 29 C10 28 5 22 5 15 Z" fill="currentColor"/><path d="M9 18 L16 29 L23 18 L16 21 Z" fill="var(--panel)"/><circle cx="16" cy="23.5" r="1.6" fill="currentColor"/><circle cx="11.5" cy="16" r="1.5" fill="var(--panel)"/><circle cx="20.5" cy="16" r="1.5" fill="var(--panel)"/></svg><span>x</span></div>
      <div class="row">
        <select id="theme" title="Theme">
          <option value="system">system</option>
          <option value="dark">dark</option>
          <option value="light">light</option>
          <option value="mauve">mauve</option>
          <option value="night">night sky</option>
        </select>
        <button type="button" id="pick-folder" class="icon" title="Open fx in a folder…"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 4a1 1 0 0 1 1-1h3.2l1.5 1.5h6.3a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1z"/><path d="M8 7v4M6 9h4"/></svg></button>
        <button id="bell" class="icon" title="Sound + desktop notification when an agent finishes or needs input">🔔</button>
        <button id="refresh" class="icon" title="Refresh">↻</button>
      </div>
    </header>
    <div id="summary"></div>
    <form id="new-session" autocomplete="off" class="hidden">
      <div class="row">
        <input id="new-cwd" placeholder="~/path/to/repo" />
        <button type="submit" class="icon" title="Open">↵</button>
      </div>
      <div id="new-cwd-hint" class="hint"></div>
    </form>
    <div id="session-groups"></div>
  </aside>

  <div class="resizer" id="rs-left" title="Drag to resize"></div>
  <main id="center">
    <div id="tabbar"><div id="tabs"></div><button id="toggle-transcript" class="icon">⇥</button></div>
    <div id="terminals">
      <div id="empty-state">
        <h2>No terminal open</h2>
        <p>Click a session on the left, or start a new one in a folder.</p>
      </div>
    </div>
  </main>

  <div class="resizer" id="rs-right" title="Drag to resize"></div>
  <section id="transcript">
    <header class="side-head">
      <div id="transcript-title">Transcript</div>
      <button id="close-transcript" class="icon" title="Close">×</button>
    </header>
    <div id="transcript-meta"></div>
    <div id="search-row" class="hidden">
      <input id="search" placeholder="Search this conversation…" autocomplete="off" />
      <label class="toggle" title="Also search inside command output and files the agent read"><input type="checkbox" id="search-tools" /> tool output</label>
      <button id="search-prev" class="icon" title="Previous match in the terminal">↑</button>
      <button id="search-done" class="icon hidden" title="Leave search mode in the terminal">done</button>
    </div>
    <div id="transcript-body"><p class="muted">Select a session to read its conversation.</p></div>
  </section>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/app.js"></script>
</body>
</html>
